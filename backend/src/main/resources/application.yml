server:
  address: 127.0.0.1
  port: ${AIF_PORT:17890}
  error:
    include-message: never
spring:
  application:
    name: ai-footprint
  datasource:
    url: jdbc:sqlite:${AIF_DATABASE:../.local/footprint.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
footprint:
  assistant:
    origins: ${AIF_ALLOWED_ORIGINS:https://danjiahao88-sys.github.io,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173}
  codex-home: ${AIF_CODEX_HOME:${user.home}/.codex}
  claude-home: ${AIF_CLAUDE_HOME:${user.home}/.claude}
  claude-config: ${AIF_CLAUDE_CONFIG:${user.home}/.claude.json}
  timezone: ${AIF_TIMEZONE:Asia/Shanghai}
